<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Turn-based streaming transcription using Deepgram Flux" id="pageDescription">
  <title id="pageTitle">Flux Transcription</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./node_modules/@deepgram/styles/dist/deepgram.css" />
  <script type="module">
    import { restoreTheme } from './node_modules/@deepgram/styles/dist/utils.js';
    restoreTheme();
  </script>
  <script type="module" src="./main.js"></script>

  <style>
    /* ================================================================
       APP-SPECIFIC STYLES
       Only styles with no design system equivalent. All colors use
       design tokens (--color-dg-*) instead of hardcoded values.
       ================================================================ */

    /* Header (no design system header component) */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--color-dg-border, #2c2c33);
      background: var(--color-dg-almost-black, #050506);
    }

    .app-header h1 {
      font-size: 1.6rem;
      margin: 0;
    }

    .app-header__nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .theme-toggle .dg-btn {
      aspect-ratio: 1;
      padding: 0;
      justify-content: center;
    }

    /* Range slider (no design system range component) */
    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .range-wrapper input[type="range"] {
      flex: 1;
      accent-color: var(--color-dg-primary, #13ef95);
    }

    .range-value {
      min-width: 2.5rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Disabled state for config sections */
    .config-section--disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Sidebar visual treatment (mirrors dg-columns--fixed styling) */
    .dg-columns__column--left {
      background: var(--color-dg-almost-black);
      border-right: 1px solid var(--color-dg-border);
    }

    .dg-columns__column--right {
      background: var(--color-dg-almost-black);
      border-left: 1px solid var(--color-dg-border);
    }

    /* Main content container (app shell layout) */
    .main-content-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Transcript container */
    .transcript-container {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-dg-lg, 1.5rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Turn container groups all updates for a single turn */
    .transcript-turn {
      display: flex;
      flex-direction: column;
    }

    .transcript-item {
      background: var(--color-dg-almost-black, #050506);
      border-left: 3px solid var(--color-dg-primary, #13ef95);
      padding: var(--spacing-dg-md, 1rem);
      border-radius: var(--radius-dg-sm, 0.25rem);
      animation: fadeIn 0.3s ease-in;
    }

    /* Turn event border colors using design tokens */
    .transcript-item--start-of-turn {
      border-left-color: var(--color-dg-secondary, #149afb);
    }

    .transcript-item--update {
      border-left-color: var(--color-dg-muted, #949498);
      opacity: 0.6;
    }

    .transcript-item--eager-eot {
      border-left-color: var(--color-dg-warning, #fec84b);
      opacity: 0.8;
    }

    .transcript-item--end-of-turn {
      border-left-color: var(--color-dg-primary, #13ef95);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .transcript-item__header {
      display: flex;
      align-items: center;
      gap: var(--spacing-dg-sm, 0.5rem);
      margin-bottom: var(--spacing-dg-sm, 0.5rem);
    }

    /* Turn marker separator between completed turns */
    .transcript-turn-marker {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: var(--spacing-dg-sm, 0.5rem) 0;
    }

    .transcript-turn-marker::before,
    .transcript-turn-marker::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-dg-border, #2c2c33);
    }

    /* Turn event badges (no design system badge component) */
    .turn-event-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem var(--spacing-dg-sm, 0.5rem);
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .turn-event-badge--start-of-turn {
      background: rgba(20, 154, 251, 0.2);
      color: var(--color-dg-secondary, #149afb);
    }

    .turn-event-badge--update {
      background: rgba(148, 148, 152, 0.2);
      color: var(--color-dg-muted, #949498);
    }

    .turn-event-badge--eager-eot {
      background: rgba(254, 200, 75, 0.2);
      color: var(--color-dg-warning, #fec84b);
    }

    .turn-event-badge--turn-resumed {
      background: rgba(20, 154, 251, 0.2);
      color: var(--color-dg-secondary, #149afb);
    }

    .turn-event-badge--end-of-turn {
      background: rgba(19, 239, 149, 0.2);
      color: var(--color-dg-primary, #13ef95);
    }

    /* Connect overlay (absolute positioned over main content) */
    .connect-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-dg-background, #0b0b0c);
      z-index: 10;
    }

    .connect-overlay.hidden {
      display: none;
    }

    .connect-prompt {
      text-align: center;
      max-width: 400px;
      padding: var(--spacing-dg-xl, 2rem);
    }

    .connect-prompt__icon {
      font-size: 4rem;
      color: var(--color-dg-primary, #13ef95);
      margin-bottom: var(--spacing-dg-lg, 1.5rem);
    }

    /* Disconnect button position */
    .disconnect-container {
      position: absolute;
      top: var(--spacing-dg-md, 1rem);
      right: var(--spacing-dg-md, 1rem);
      z-index: 20;
    }

    .disconnect-container.hidden {
      display: none;
    }

    /* Status grid layout */
    .status-grid {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-dg-md, 1rem);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-dg-xs, 0.25rem);
    }

    /* Status indicator dots */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .status-indicator {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      display: inline-block;
    }

    .status-indicator--connected {
      background: var(--color-dg-primary, #13ef95);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator--disconnected {
      background: var(--color-dg-muted, #949498);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    /* Empty state (no design system equivalent) */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--spacing-dg-xl, 2rem);
    }

    .empty-state__icon {
      font-size: 3rem;
      margin-bottom: var(--spacing-dg-md, 1rem);
      opacity: 0.5;
    }

    /* Hidden utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="app-header">
    <h1 id="headerTitle">Flux Transcription</h1>
    <nav class="app-header__nav">
      <a href="https://github.com/deepgram-starters/flux-html" id="repoLink"
        class="dg-btn dg-btn--ghost dg-btn--sm" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-github"></i> GitHub
      </a>
      <a href="https://console.deepgram.com" class="dg-btn dg-btn--secondary dg-btn--sm" target="_blank"
        rel="noopener noreferrer">Free API Key</a>
      <div class="dg-action-group theme-toggle">
        <button type="button" class="dg-btn dg-btn--ghost dg-btn--sm" id="theme-light"
          aria-label="Light mode">
          <i class="fas fa-sun"></i>
        </button>
        <button type="button" class="dg-btn dg-btn--ghost dg-btn--sm" id="theme-dark"
          aria-label="Dark mode">
          <i class="fas fa-moon"></i>
        </button>
        <button type="button" class="dg-btn dg-btn--ghost dg-btn--sm" id="theme-system"
          aria-label="System theme">
          <i class="fas fa-desktop"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- Three-Column Layout -->
  <div class="dg-columns" style="width: 100%; max-width: 100%; min-height: calc(100vh - 49px);">
    <div class="dg-columns__wrapper">

      <!-- Left Sidebar: Configuration -->
      <aside class="dg-columns__column dg-columns__column--left dg-columns__column--lg" role="aside">
        <h3 class="dg-section-heading">Configuration</h3>

        <!-- EOT Threshold -->
        <div class="dg-form-field">
          <label class="dg-form-label" for="eot-threshold">
            <i class="fa-solid fa-bullseye dg-icon"></i> EOT Threshold
          </label>
          <div class="range-wrapper">
            <input type="range" id="eot-threshold" min="0.5" max="0.9" step="0.05" value="0.7" />
            <span class="range-value dg-prose dg-prose--small dg-text-fog" id="eot-threshold-value">0.70</span>
          </div>
        </div>

        <!-- Enable Eager EOT -->
        <div class="dg-form-field">
          <label class="dg-toggle-label">
            <input type="checkbox" class="dg-toggle" id="eager-eot-enabled" />
            Enable Eager EOT
          </label>
        </div>

        <!-- Eager EOT Threshold -->
        <div class="dg-form-field config-section--disabled" id="eager-eot-section">
          <label class="dg-form-label" for="eager-eot-threshold">
            <i class="fa-solid fa-forward-fast dg-icon"></i> Eager EOT Threshold
          </label>
          <div class="range-wrapper">
            <input type="range" id="eager-eot-threshold" min="0.3" max="0.9" step="0.05" value="0.6" disabled />
            <span class="range-value dg-prose dg-prose--small dg-text-fog"
              id="eager-eot-threshold-value">0.60</span>
          </div>
        </div>

        <!-- EOT Timeout -->
        <div class="dg-form-field">
          <label class="dg-form-label" for="eot-timeout">
            <i class="fa-solid fa-clock dg-icon"></i> EOT Timeout (ms)
          </label>
          <input type="number" id="eot-timeout" class="dg-input" value="5000" min="1000" max="30000" step="500" />
        </div>

        <!-- Key Terms -->
        <div class="dg-form-field">
          <label class="dg-form-label" for="keyterm-input">
            <i class="fa-solid fa-key dg-icon"></i> Key Terms
          </label>
          <input type="text" id="keyterm-input" class="dg-input" placeholder="term1, term2, term3" />
        </div>
      </aside>

      <!-- Main Content: Transcript Display -->
      <div class="dg-columns__column dg-columns__column--center" role="main">
        <div class="main-content-container">
          <!-- Inline error alert (hidden by default) -->
          <div class="dg-alert dg-alert--danger hidden" id="error-alert">
            <div class="dg-alert__content">
              <i class="dg-alert__icon fas fa-circle-xmark"></i>
              <div class="dg-alert__body">
                <h3 class="dg-alert__title">Error</h3>
                <div class="dg-alert__description">
                  <p></p>
                </div>
              </div>
            </div>
          </div>

          <!-- Connect Overlay -->
          <div class="connect-overlay" id="connect-overlay">
            <div class="connect-prompt">
              <div class="connect-prompt__icon">
                <i class="fa-solid fa-microphone"></i>
              </div>
              <h2 class="dg-section-heading">Flux Transcription Ready</h2>
              <p class="dg-prose dg-text-muted">Configure settings and click Connect to start</p>
              <br />
              <button type="button" id="connect-btn" class="dg-btn dg-btn--primary">
                <i class="fa-solid fa-plug"></i> Connect
              </button>
            </div>
          </div>

          <!-- Disconnect Button -->
          <div class="disconnect-container hidden" id="disconnect-container">
            <button type="button" id="disconnect-btn" class="dg-btn dg-btn--secondary dg-btn--sm">
              <i class="fa-solid fa-plug-circle-xmark"></i> Disconnect
            </button>
          </div>

          <!-- Transcript Container -->
          <div class="transcript-container hidden" id="transcript-container">
            <div class="empty-state" id="empty-state">
              <div class="empty-state__icon dg-text-muted">
                <i class="fa-solid fa-microphone"></i>
              </div>
              <p class="dg-prose dg-text-muted">Waiting for audio...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Status -->
    <aside class="dg-columns__column dg-columns__column--right" role="aside">
      <h3 class="dg-section-heading">Status</h3>
      <div class="status-grid">
        <div class="status-item">
          <div class="dg-prose dg-prose--small dg-text-muted">Connection</div>
          <div>
            <span class="status-badge dg-text-muted" id="connection-status">
              <span class="status-indicator status-indicator--disconnected"></span>
              Disconnected
            </span>
          </div>
        </div>
        <div class="status-item">
          <div class="dg-prose dg-prose--small dg-text-muted">Microphone</div>
          <div class="dg-prose dg-prose--small" id="mic-status">Inactive</div>
        </div>
        <div class="status-item">
          <div class="dg-prose dg-prose--small dg-text-muted">Request ID</div>
          <div class="dg-prose dg-prose--small" id="request-id"
            style="font-family: var(--font-dg-mono, monospace); font-size: 0.75rem; word-break: break-all;">-</div>
        </div>
        <div class="status-item">
          <div class="dg-prose dg-prose--small dg-text-muted">Messages Received</div>
          <div class="dg-prose dg-prose--small" id="message-count">0</div>
        </div>
        <div class="status-item">
          <div class="dg-prose dg-prose--small dg-text-muted">Completed Turns</div>
          <div class="dg-prose dg-prose--small" id="turn-count">0</div>
        </div>
        <div class="status-item">
          <div class="dg-prose dg-prose--small dg-text-muted">Current Turn</div>
          <div id="current-turn-event">
            <span class="turn-event-badge" style="visibility: hidden;">-</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

</body>

</html>
